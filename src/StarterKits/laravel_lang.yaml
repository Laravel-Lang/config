plugins:
    -   vendor: 'laravel/livewire-starter-kit'
        project: true
        files:
            -   source: 'livewire/main/livewire.json'
                target: '{locale}.json'
            -   source: 'livewire/components/livewire.json'
                target: '{locale}.json'
            -   source: 'livewire/teams/livewire.json'
                target: '{locale}.json'
            -   source: 'livewire/workos-teams/livewire.json'
                target: '{locale}.json'
            -   source: 'livewire/workos/livewire.json'
                target: '{locale}.json'

    -   vendor: 'laravel/react-starter-kit'
        project: true
        files:
            -   source: 'react/main/react.json'
                target: '{locale}.json'
            -   source: 'react/components/react.json'
                target: '{locale}.json'
            -   source: 'react/teams/react.json'
                target: '{locale}.json'
            -   source: 'react/workos-teams/react.json'
                target: '{locale}.json'
            -   source: 'react/workos/react.json'
                target: '{locale}.json'

    -   vendor: 'laravel/svelte-starter-kit'
        project: true
        files:
            -   source: 'svelte/main/svelte.json'
                target: '{locale}.json'
            -   source: 'svelte/components/svelte.json'
                target: '{locale}.json'
            -   source: 'svelte/teams/svelte.json'
                target: '{locale}.json'
            -   source: 'svelte/workos-teams/svelte.json'
                target: '{locale}.json'
            -   source: 'svelte/workos/svelte.json'
                target: '{locale}.json'

    -   vendor: 'laravel/vue-starter-kit'
        project: true
        files:
            -   source: 'vue/main/vue.json'
                target: '{locale}.json'
            -   source: 'vue/components/vue.json'
                target: '{locale}.json'
            -   source: 'vue/teams/vue.json'
                target: '{locale}.json'
            -   source: 'vue/workos-teams/vue.json'
                target: '{locale}.json'
            -   source: 'vue/workos/vue.json'
                target: '{locale}.json'
