name: Update license

on:
    schedule:
        -   cron: '0 3 1 1 *'
    workflow_dispatch:

jobs:
    main:
        runs-on: ubuntu-latest
        
        steps:
            -   uses: TheDragonCode/.github/.github/workflows/license.yml@main

    search:
        runs-on: ubuntu-latest
        outputs:
            directories: ${{ steps.set-dirs.outputs.directories }}
        steps:
            -   uses: actions/checkout@v6

            -   id: set-dirs
                run: |
                    echo "directories::$(find $GITHUB_WORKSPACE/src -mindepth 1 -maxdepth 1 -type d | jq -R -s -c 'split("\n")[:-1] | map({path: ., name: (split("/") | last)})')" >> $GITHUB_OUTPUT

    packages:
        needs: search
        runs-on: ubuntu-latest
        
        strategy:
            matrix:
                directory: ${{ fromJson(needs.packages.outputs.directories) }}

        name: Update ${{ matrix.directory }} package

        steps:
            -   uses: TheDragonCode/.github/.github/workflows/license.yml@main
                with:
                    path: src/${{ matrix.directory }}/LICENSE.md
