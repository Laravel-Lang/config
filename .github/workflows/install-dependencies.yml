name: Install Dependencies

on: [ push, pull_request, workflow_dispatch ]

permissions: read-all

jobs:
    install:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: true
            matrix:
                package:
                    - Actions
                    - Attributes
                    - Common
                    - Config
                    - HttpStatuses
                    - JsonFallback
                    - Lang
                    - Library
                    - LocaleList
                    - Locales
                    - Models
                    - MoonShine
                    - NativeCountryNames
                    - NativeCurrencyNames
                    - NativeLocaleNames
                    - Publisher
                    - Routes
                    - StarterKits
                    - StatusGenerator
                    - TranslationsTemplate
                php: [ "8.3", "8.4", "8.5" ]
                laravel: [ "11.0", "12.0" ]

        name: Package ${{ matrix.package }}, PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}

        steps:
            -   uses: actions/checkout@v6

            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}

            -   name: Install dependencies
                run: composer -W src/${{ matrix.package }} require laravel/framework:^${{ matrix.laravel }}
