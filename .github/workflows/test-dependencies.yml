name: Test Dependencies

on: [ push, pull_request, workflow_dispatch ]

permissions: read-all

jobs:
    packages:
        runs-on: ubuntu-latest
        outputs:
            directories: ${{ steps.set-dirs.outputs.directories }}
        steps:
            -   uses: actions/checkout@v6

            -   id: set-dirs
                run: |
                    echo "directories::$(find $GITHUB_WORKSPACE/src -mindepth 1 -maxdepth 1 -type d | jq -R -s -c 'split("\n")[:-1] | map({path: ., name: (split("/") | last)})')" >> $GITHUB_OUTPUT
    
    install:
        needs: packages
        runs-on: ubuntu-latest

        strategy:
            fail-fast: true
            matrix:
                directory: ${{ fromJson(needs.packages.outputs.directories) }}
                php: [ "8.3", "8.4", "8.5" ]
                laravel: [ "11.0", "12.0", "13.0" ]

        name: Package ${{ matrix.package }}, PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}

        steps:
            -   uses: actions/checkout@v6

            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}

            -   name: Install dependencies
                run: composer -W src/${{ matrix.directory }} require --dev laravel/framework:^${{ matrix.laravel }}
