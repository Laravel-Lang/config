    packages:
        runs-on: ubuntu-latest
        outputs:
            directories: ${{ steps.set-dirs.outputs.directories }}
        steps:
            -   uses: actions/checkout@v6
            -   uses: shivammathur/setup-php@v2

            -   name: Setup Composer
                run: |
                    composer global config --no-plugins allow-plugins.ergebnis/composer-normalize true
                    composer config --no-plugins allow-plugins.ergebnis/composer-normalize true

            -   name: Install Normalizer
                run: composer global require ergebnis/composer-normalize

            -   id: set-dirs
                run: |
                    echo "directories=$(find $GITHUB_WORKSPACE/src -mindepth 2 -maxdepth 2 -type f -name composer.json -print0 | xargs -0 -n1 dirname | jq -R -s -c 'split("\n")[:-1] | map({path: ., name: (split("/") | last)})')" >> $GITHUB_OUTPUT

    normalize:
        needs: packages
        runs-on: ubuntu-latest
        
        strategy:
            matrix:
                directory: ${{ fromJson(needs.packages.outputs.directories) }}

        name: Normalize ${{ matrix.directory.name }}

        steps:
            -   uses: actions/checkout@v6

            -   name: Normalize
                run: composer normalize -d "${{ matrix.directory.path }}"
    
    pullRequest:
        needs: normalize
        runs-on: ubuntu-latest
        
        steps:
            -   name: Create a Pull Request
                uses: peter-evans/create-pull-request@v8
                id: pullRequest
                with:
                    branch: composer-normalize
                    branch-suffix: random
                    delete-branch: true
                    title: "🦋 composer.json was Normalized"
                    commit-message: 🦋 composer.json was Normalized
                    body: composer.json was Normalized
                    labels: dependencies
                    add-paths: |
                        composer.json
                        src/**/composer.json

            -   name: Merge PR
                if: steps.pullRequest.outputs.pull-request-number != ''
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: gh pr merge --merge --auto ${{ steps.pullRequest.outputs.pull-request-number }}
