    packages:
        runs-on: ubuntu-latest
        outputs:
            directories: ${{ steps.set-dirs.outputs.directories }}
        steps:
            -   uses: actions/checkout@v6
            -   uses: shivammathur/setup-php@v2

            -   name: Setup Composer
                run: |
                    composer global config --no-plugins allow-plugins.ergebnis/composer-normalize true
                    composer config --no-plugins allow-plugins.ergebnis/composer-normalize true

            -   name: Install Normalizer
                run: composer global require ergebnis/composer-normalize

            -   id: set-dirs
                run: |
                    directories=$(find "$GITHUB_WORKSPACE/src" -type d -print0 | while IFS= read -r -d '' directory; do
                        name=$(basename "$directory")

                        if [ -f "$directory/composer.json" ]; then
                            has_composer=true
                        else
                            has_composer=false
                        fi

                        jq -n --arg directory "$directory" --arg name "$name" --argjson hasComposer "$has_composer" '{directory: $directory, name: $name, hasComposer: $hasComposer}'
                    done | jq -s -c '.')

                    echo "::set-output name=directories::$directories"

    normalize:
        needs: packages
        runs-on: ubuntu-latest
        
        strategy:
            matrix:
                package: ${{ fromJson(needs.packages.outputs.directories) }}

        name: Normalize ${{ matrix.package.name }}
        if: ${{ matrix.package.hasComposer }}

        steps:
            -   name: Normalize
                run: composer normalize -d "${{ matrix.package.directory }}"
    
    pullRequest:
        needs: normalize
        runs-on: ubuntu-latest
        
        steps:
            -   name: Create a Pull Request
                uses: peter-evans/create-pull-request@v8
                id: pullRequest
                with:
                    branch: composer-normalize
                    branch-suffix: random
                    delete-branch: true
                    title: "🦋 composer.json was Normalized"
                    commit-message: 🦋 composer.json was Normalized
                    body: composer.json was Normalized
                    labels: dependencies
                    add-paths: |
                        composer.json
                        src/**/composer.json

            -   name: Merge PR
                if: steps.pullRequest.outputs.pull-request-number != ''
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: gh pr merge --merge --auto ${{ steps.pullRequest.outputs.pull-request-number }}
