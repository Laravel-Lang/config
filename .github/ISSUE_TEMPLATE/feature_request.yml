name: Feature Proposal
description: Propose a new feature

labels:
    - feature

body:
    -   type: input
        id: environment-package-name
        attributes:
            label: Lang Package Name
            description: The name of the package in which the bug was found.
            options:
                - laravel-lang/actions
                - laravel-lang/attributes
                - laravel-lang/common
                - laravel-lang/config
                - laravel-lang/http-statuses
                - laravel-lang/json-fallback
                - laravel-lang/lang
                - laravel-lang/library
                - laravel-lang/locale-list
                - laravel-lang/locales
                - laravel-lang/models
                - laravel-lang/moonshine
                - laravel-lang/native-country-names
                - laravel-lang/native-currency-names
                - laravel-lang/native-locale-names
                - laravel-lang/publisher
                - laravel-lang/routes
                - laravel-lang/starter-kits
                - laravel-lang/status-generator
        validations:
            required: true

    -   type: textarea
        id: description
        attributes:
            label: Feature description
            description: |
                Think through your proposal and describe it clearly.

                Note that features are only added to the most recent version of Laravel-Lang project.
        validations:
            required: true

    -   type: markdown
        attributes:
            value: |
                ❤️ Laravel Lang? Please consider supporting our collective: https://boosty.to/laravel-lang
